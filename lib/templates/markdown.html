<!DOCTYPE html>
<html data-theme="{{theme}}">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>{{title}}</title>
	<meta charset="utf-8">
	<link rel="stylesheet" id="theme-dark" href="{markserv}templates/github-markdown-dark.css"{{#unless themeDark}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-light" href="{markserv}templates/github-markdown-light.css"{{#unless themeLight}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-synthwave" href="{markserv}templates/github-markdown-synthwave.css"{{#unless themeSynthwave}} disabled{{/unless}}>
	<link rel="stylesheet" id="theme-solarized" href="{markserv}templates/github-markdown-solarized.css"{{#unless themeSolarized}} disabled{{/unless}}>
	<link rel="stylesheet" href="{markserv}templates/markserv.css">
	<link rel="stylesheet" href="{markserv}templates/highlight-js-github-gist.css">
	<link rel="stylesheet" href="{markserv}templates/comments.css">
	<link rel="stylesheet" href="{markserv}templates/toc.css">
	<link rel="stylesheet" href="{markserv}templates/mermaid.css">
	<link rel="stylesheet" href="{markserv}templates/md-comments.css">
	<link rel="stylesheet" href="{markserv}templates/diff-block.css">
	<link rel="stylesheet" href="{markserv}templates/code-block.css">
	<script type="text/javascript" id="MathJax-script" async
	      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
        </script>
</head>
<body class="marker-doc">
<article class="markdown-body">
<div class="marker-file-path" id="marker-file-path" data-path="{{filePath}}"></div>
<div id="marker-content">
{{{content}}}
</div>
<footer><sup><hr> Served by <a href="https://github.com/0xys/markserv-marker" target="_blank" rel="noopener noreferrer">markserv-marker</a> v{{version}} | <a href="/">index</a> | PID: {{pid}} | inspired by <a href="https://github.com/markserv/markserv" target="_blank" rel="noopener noreferrer">markserv</a></sup></footer>
</article>
<div class="page-controls">
	<a class="page-btn" id="index-link" href="/" title="Index page">🏠</a>
	<button class="page-btn" id="width-toggle" title="Expand to window width">⛶</button>
	<button class="page-btn" id="theme-toggle" title="Toggle theme"></button>
</div>
<script>
(function() {
	var themes = ['dark', 'light', 'synthwave', 'solarized'];
	var icons = {dark: '\u{1F319}', light: '\u{2600}\u{FE0F}', synthwave: '\u{1F9D1}\u{200D}\u{1F3A4}', solarized: '\u{262F}\u{FE0F}'};
	var serverTheme = '{{theme}}' || 'dark';
	var current = localStorage.getItem('markserv-theme') || serverTheme;

	function applyTheme(t) {
		document.documentElement.setAttribute('data-theme', t);
		themes.forEach(function(name) {
			var el = document.getElementById('theme-' + name);
			if (el) el.disabled = (name !== t);
		});
		var btn = document.getElementById('theme-toggle');
		if (btn) btn.textContent = icons[t] || icons.dark;
		current = t;
		// Mermaid diagrams carry their colours in the SVG and have to be redrawn
		document.dispatchEvent(new CustomEvent('marker:theme', {detail: {theme: t}}));
	}

	applyTheme(current);

	document.getElementById('theme-toggle').addEventListener('click', function() {
		var idx = themes.indexOf(current);
		var next = themes[(idx + 1) % themes.length];
		localStorage.setItem('markserv-theme', next);
		applyTheme(next);
	});
})();
</script>
<script>
(function() {
	var btn = document.getElementById('width-toggle');
	if (!btn) return;
	var KEY = 'markserv-marker-wide';

	function apply(wide) {
		document.body.style.width = wide ? '100%' : '';
		// The column changed width without the window doing so; widths pinned
		// to a table and the sticky-header choice per table both follow resize
		window.dispatchEvent(new Event('resize'));
		btn.textContent = wide ? '\u25A3' : '\u26F6';
		btn.title = wide ? 'Back to default width' : 'Expand to window width';
	}

	apply(localStorage.getItem(KEY) === '1');

	btn.addEventListener('click', function() {
		var next = document.body.style.width !== '100%';
		localStorage.setItem(KEY, next ? '1' : '0');
		apply(next);
	});
})();
</script>
<script src="{markserv}templates/file-path.js" defer></script>
{{#if hotreload}}
<script>
(function() {
	var ws;
	var delay = 1000;
	var maxDelay = 30000;
	var maxRetries = 20;
	var retries = 0;

	// A push replaces the content, and the comment forms and the editor live
	// inside it, so one arriving mid-sentence takes the caret, an IME
	// composition in progress and the reader's scroll position with it.
	// keptAcrossRender in comments.js spares those elements on a re-render,
	// but it never gets the chance here — the swap below is what destroys
	// them. So while the reader is writing, the push is held and applied once
	// they leave the field. Only the newest is kept: each carries the whole
	// page, so an older one has nothing left to say.
	var held = null;
	var heldComments = false;

	function writing() {
		var node = document.activeElement;
		if (!node || !node.closest) return false;
		if (node.tagName !== 'TEXTAREA' && node.tagName !== 'INPUT') return false;
		return !!node.closest('[data-marker-ui]');
	}

	function applyReload(html) {
		var el = document.getElementById('marker-content');
		if (el) el.innerHTML = html;
		document.dispatchEvent(new CustomEvent('marker:reload'));
	}

	function flush() {
		if (held !== null) {
			var html = held;
			held = null;
			heldComments = false;
			applyReload(html);
			return;
		}
		if (heldComments) {
			heldComments = false;
			document.dispatchEvent(new CustomEvent('marker:comments'));
		}
	}

	// focusout runs before the next field takes focus, so decide a tick later
	document.addEventListener('focusout', function() {
		setTimeout(function() { if (!writing()) flush(); }, 0);
	});

	function connect() {
		ws = new WebSocket('ws://localhost:{{wsPort}}');
		ws.onopen = function() {
			delay = 1000;
			retries = 0;
			// window.__marker is set by a later inline script, which has run by
			// the time the socket opens. Its fileId is the registration the
			// comments live under, which is not the id in the URL when this file
			// was reached through a directory registration.
			var marker = window.__marker || {};
			ws.send(JSON.stringify({path: location.pathname, fileId: marker.fileId || null}));
		};
		ws.onmessage = function(e) {
			var msg;
			try { msg = JSON.parse(e.data); } catch (err) { return; }
			if (msg.type === 'reload') {
				if (writing()) { held = msg.html; return; }
				applyReload(msg.html);
			} else if (msg.type === 'comments') {
				if (writing()) { heldComments = true; return; }
				document.dispatchEvent(new CustomEvent('marker:comments'));
			}
		};
		ws.onclose = function() {
			if (retries < maxRetries) {
				retries++;
				setTimeout(connect, delay);
				delay = Math.min(delay * 2, maxDelay);
			}
		};
	}
	connect();
})();
</script>
{{/if}}
<!-- diff-core.js publishes the word diff both diff-block.js and comments.js
     read; defer runs these in document order, so it goes first -->
<script src="{markserv}templates/diff-core.js" defer></script>
<script src="{markserv}templates/toc.js" defer></script>
<script src="{markserv}templates/mermaid.js" defer></script>
<script src="{markserv}templates/md-comments.js" defer></script>
<script src="{markserv}templates/diff-block.js" defer></script>
<script src="{markserv}templates/code-block.js" defer></script>
<script src="{markserv}templates/table-head.js" defer></script>
{{#if fileId}}
<script>
window.__marker = {
	fileId: '{{fileId}}',
	apiBase: '/api',
	hotreload: {{#if hotreload}}true{{else}}false{{/if}}
};
</script>
<script src="{markserv}templates/comments.js" defer></script>
{{/if}}
</body>
</html>
